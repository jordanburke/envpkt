name: Action Smoke Test

# End-to-end check of the composite action (action.yml).
# Fully self-contained: generates a throwaway age keypair, seals a test value,
# runs the action, and asserts the secret was decrypted, masked, and propagated
# to a later step via $GITHUB_ENV. No repository secrets required.
#
# Two jobs:
#   smoke           — runs the LOCAL action (uses: ./) against envpkt built from this checkout,
#                     with no `age` installed, gated to action/workflow/source changes.
#   smoke-published — runs the PUBLISHED ref (uses: jordanburke/envpkt@v0), the exact path
#                     consumers use, on the weekly cron + manual dispatch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "envpkt version (0.18.0 or later) the published job uses for keygen, seal and the action"
        required: false
        default: "latest"
  # Gate changes to the action itself / this workflow.
  pull_request:
    paths:
      - "action.yml"
      - ".github/workflows/action-smoke.yml"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "action.yml"
      - ".github/workflows/action-smoke.yml"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
  # Catch drift in the published CLI that the action runs (no commit required).
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # No `age` install: envpkt seals, unseals and makes keys in-process, and this job proves it.
      # The action runs `npx envpkt@<version>`, so pack this checkout and point the action at it.
      - name: Build and pack envpkt from this checkout
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "ENVPKT_SMOKE_VERSION=file:$(ls "$RUNNER_TEMP"/envpkt-*.tgz)" >> "$GITHUB_ENV"

      - name: Create an ephemeral sealed config
        shell: bash
        run: |
          set -euo pipefail
          # The point of this job: nothing below may need the age CLI.
          if command -v age >/dev/null; then echo "::error::age is installed; this job must run without it"; exit 1; fi
          envpkt="node $GITHUB_WORKSPACE/dist/cli.js"
          cfg="$RUNNER_TEMP/envpkt.toml"
          key="$RUNNER_TEMP/smoke-key.txt"
          printf 'version = 1\n[namespace]\nprefix = "CIV"\n[secret.SMOKE_KEY]\nservice = "smoke"\n' > "$cfg"
          $envpkt keygen -c "$cfg" -o "$key"
          printf 'smoke-value' | $envpkt seal -c "$cfg" --edit SMOKE_KEY --stdin
          secret="$(grep '^AGE-SECRET-KEY-' "$key")"
          # Like a real CI job: the config's key_file is a dev-local path that isn't here, so the
          # action must fall through to the inline ENVPKT_AGE_KEY.
          rm "$key"

          # Throwaway key — mask it and hand it to the action via the job env.
          echo "::add-mask::$secret"
          {
            echo "ENVPKT_SMOKE_CONFIG=$cfg"
            echo "ENVPKT_AGE_KEY=$secret"
          } >> "$GITHUB_ENV"

      - name: Run the envpkt action
        uses: ./
        with:
          config: ${{ env.ENVPKT_SMOKE_CONFIG }}
          version: ${{ env.ENVPKT_SMOKE_VERSION }}
          strict: "true"
        env:
          ENVPKT_AGE_KEY: ${{ env.ENVPKT_AGE_KEY }}

      - name: Verify injection into $GITHUB_ENV
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CIV__SMOKE_KEY:-}" != "smoke-value" ]; then
            echo "FAIL: CIV__SMOKE_KEY was not injected (got: '${CIV__SMOKE_KEY:-<unset>}')"
            exit 1
          fi
          # The plain/logical name must NOT be set — only the namespaced wire name.
          if [ -n "${SMOKE_KEY:-}" ]; then
            echo "FAIL: unexpected logical name SMOKE_KEY is set"
            exit 1
          fi
          echo "OK: sealed secret resolved (inline ENVPKT_AGE_KEY), masked, and injected as CIV__SMOKE_KEY"

  # Same assertions, but against the PUBLISHED action ref (uses: jordanburke/envpkt@v0) —
  # the exact path consumers rely on. No checkout: like a real consumer, it pulls the action
  # from the tag. Gated to the weekly cron + manual dispatch (a PR to action.yml can't change
  # the already-tagged @v0, and running it per-push adds no signal).
  smoke-published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # The action doesn't set up Node, and envpkt needs 22.12 or later: consumers add this step too.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Create an ephemeral sealed config
        shell: bash
        run: |
          set -euo pipefail
          # Like the smoke job, but with the published CLI: nothing here may need the age CLI.
          if command -v age >/dev/null; then echo "::error::age is installed; this job must run without it"; exit 1; fi
          envpkt="npx --yes envpkt@${{ inputs.version || 'latest' }}"
          cfg="$RUNNER_TEMP/envpkt.toml"
          key="$RUNNER_TEMP/smoke-key.txt"
          printf 'version = 1\n[namespace]\nprefix = "CIV"\n[secret.SMOKE_KEY]\nservice = "smoke"\n' > "$cfg"
          $envpkt keygen -c "$cfg" -o "$key"
          printf 'smoke-value' | $envpkt seal -c "$cfg" --edit SMOKE_KEY --stdin
          secret="$(grep '^AGE-SECRET-KEY-' "$key")"
          rm "$key"

          # Throwaway key — mask it and hand it to the action via the job env.
          echo "::add-mask::$secret"
          {
            echo "ENVPKT_SMOKE_CONFIG=$cfg"
            echo "ENVPKT_AGE_KEY=$secret"
          } >> "$GITHUB_ENV"

      - name: Run the PUBLISHED envpkt action (@v0)
        uses: jordanburke/envpkt@v0
        with:
          config: ${{ env.ENVPKT_SMOKE_CONFIG }}
          version: ${{ inputs.version || 'latest' }}
          strict: "true"
        env:
          ENVPKT_AGE_KEY: ${{ env.ENVPKT_AGE_KEY }}

      - name: Verify injection into $GITHUB_ENV
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CIV__SMOKE_KEY:-}" != "smoke-value" ]; then
            echo "FAIL: CIV__SMOKE_KEY was not injected (got: '${CIV__SMOKE_KEY:-<unset>}')"
            exit 1
          fi
          # The plain/logical name must NOT be set — only the namespaced wire name.
          if [ -n "${SMOKE_KEY:-}" ]; then
            echo "FAIL: unexpected logical name SMOKE_KEY is set"
            exit 1
          fi
          echo "OK: published action @v0 resolved sealed secret, masked, and injected as CIV__SMOKE_KEY"
