name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push to a pull request cancels the build it supersedes. A push to main gets a group of its own,
# because GitHub cancels a waiting run when a newer one joins its group, even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Maintained Node lines only; see the engines field in package.json. pnpm itself needs
    # 22.13+, so the 22.12.0 engines floor is checked by hand, not here.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      # Only the interop spec (test/core/age-interop.spec.ts) uses the `age` CLI: it checks that
      # values the CLI seals unseal in envpkt and the other way round. Everything else runs without it.
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Pipeline
        run: pnpm run ci
