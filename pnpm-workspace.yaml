allowBuilds:
  esbuild: false # binary ships via @esbuild/<platform> optional deps; postinstall not needed

minimumReleaseAgeExclude:
  - "*functype*"
  - ts-builds
  - somamcp
  - "@types/node@24.13.1" # auto-added (no aged alternative for ^24.13.1)

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"
